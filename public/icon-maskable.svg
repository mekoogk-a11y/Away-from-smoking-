<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Eggshell White ("لون البيضة") Gradient -->
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#faf6ed"/>
      <stop offset="100%" stop-color="#f2eae0"/>
    </linearGradient>

    <!-- Flame / Glow Gradient -->
    <radialGradient id="emberGlowMask" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f97316"/>
      <stop offset="80%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="filterGradMask" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="paperGradMask" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <filter id="shadowMask" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#450a0a" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full Bleed Square Canvas (Maskable requires 100% fill) -->
  <rect width="512" height="512" fill="url(#bgGradMask)"/>
  
  <!-- Content Group scaled to 80% to fit within Android safe zone -->
  <g id="app-graphics" transform="translate(51.2, 51.2) scale(0.8)">
    
    <!-- Cigarette Element (Rotated -30 deg) -->
    <g transform="rotate(-30 256 256)">
      <!-- Soft cigarette drop shadow -->
      <rect x="135" y="240" width="275" height="50" rx="10" fill="#000000" fill-opacity="0.08"/>

      <!-- Smoke effect at tip -->
      <path d="M 125 240 C 105 210, 115 180, 85 160 C 105 170, 95 195, 120 220 Z" fill="#64748b" fill-opacity="0.45"/>
      <path d="M 135 235 C 115 195, 130 165, 110 135 C 125 155, 120 185, 130 215 Z" fill="#94a3b8" fill-opacity="0.35"/>

      <!-- Cigarette Paper Body - Defined Slate Stroke -->
      <rect x="135" y="226" width="200" height="60" rx="10" fill="url(#paperGradMask)" stroke="#334155" stroke-width="5"/>
      <rect x="138" y="260" width="194" height="22" rx="6" fill="#e2e8f0" fill-opacity="0.7"/>
      
      <!-- Filter Tip -->
      <rect x="335" y="226" width="75" height="60" rx="8" fill="url(#filterGradMask)" stroke="#78350f" stroke-width="5"/>
      <line x1="335" y1="226" x2="335" y2="286" stroke="#451a03" stroke-width="5"/>
      
      <!-- Filter Cork Texture Dots -->
      <circle cx="355" cy="242" r="3" fill="#78350f" opacity="0.8"/>
      <circle cx="375" cy="248" r="3" fill="#78350f" opacity="0.8"/>
      <circle cx="390" cy="240" r="3" fill="#78350f" opacity="0.8"/>
      <circle cx="360" cy="268" r="3" fill="#78350f" opacity="0.8"/>
      <circle cx="380" cy="265" r="3" fill="#78350f" opacity="0.8"/>
      <circle cx="395" cy="272" r="3" fill="#78350f" opacity="0.8"/>

      <!-- Burning Tip / Ember -->
      <rect x="116" y="228" width="20" height="56" rx="6" fill="#334155" stroke="#0f172a" stroke-width="3"/>
      <rect x="124" y="234" width="14" height="44" rx="4" fill="#ef4444"/>
      <circle cx="120" cy="256" r="30" fill="url(#emberGlowMask)"/>

      <!-- Burning sparks 🔥 -->
      <circle cx="108" cy="235" r="4" fill="#fbbf24"/>
      <circle cx="98" cy="260" r="5" fill="#f97316"/>
      <circle cx="112" cy="275" r="3.5" fill="#f87171"/>
    </g>

    <!-- Prominent Red Prohibition Circle / Shield Halo -->
    <circle cx="256" cy="256" r="185" fill="none" stroke="#dc2626" stroke-width="28" filter="url(#shadowMask)"/>
    <circle cx="256" cy="256" r="185" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.6"/>

    <!-- SINGLE BOLD RED DIAGONAL SLASH -->
    <line x1="125" y1="125" x2="387" y2="387" stroke="#ffffff" stroke-width="44" stroke-linecap="round"/>
    <line x1="125" y1="125" x2="387" y2="387" stroke="#dc2626" stroke-width="32" stroke-linecap="round" filter="url(#shadowMask)"/>
    <line x1="135" y1="135" x2="377" y2="377" stroke="#fca5a5" stroke-width="7" stroke-linecap="round" stroke-opacity="0.7"/>
  </g>
</svg>
